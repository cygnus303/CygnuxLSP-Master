<div class="row">
  <div class="col-sm-12">
    <div class="card mb-0">
      <div class="modal-header bs-blue d-flex justify-content-between">
        <h5 class="modal-title" id="exampleModalLabel">{{!lspMappingId ? 'Add LSP Mapping' : 'Update LSP Mapping'}}</h5>
        <button data-bs-dismiss="modal" class="close" (click)="onClose()"><i class="fa fa-close"></i></button>
      </div>

      <div class="card-body p-3 mb-0">
        <div class="row position-relative">
          <!-- Customer List -->
          <div class="col-md-4">
            <div class="border-color">
              <div class="lsp-data card mb-0 p-2 shadow-sm">
                <div class="d-flex justify-content-between align-items-center">
                  <h5 class="mb-0 name-list single-line">Customer</h5>
                  <span *ngIf="!showCustomerSearch" class="input-group-text cursor-pointer" (click)="toggleSearch('customer')">
                    <i class="fas fa-search"></i>
                  </span>
                  <div *ngIf="showCustomerSearch" class="input-group leftright-radius ms-2">
                    <input class="form-control" placeholder="Search Customer..." [(ngModel)]="customerSearchText">
                    <span class="input-group-text cursor-pointer" (click)="toggleSearch('customer')">
                      <i class="fas fa-search"></i>
                    </span>
                  </div>
                </div>
              </div>

              <div class="p-3 overflow-lab">
                <ul *ngFor="let customer of unmappedCustomers | searchList: customerSearchText" (click)="selectCustomer(customer)">
                  <li class="p-2 mb-2 searc-data d-flex justify-content-between align-items-center cursor-pointer">
                    <div class="mr-0 p-2 lab-color w-100 d-flex justify-content-between"
                      [class.bg-info]="selectedCustomer?.customerId === customer.customerId">
                      <span>{{ customer.customerName }}</span>
                      <span>{{ (mappedCustomerLspMap[customer.customerId] || []).length }}</span>
                    </div>
                  </li>
                </ul>
              </div>
            </div>
          </div>

          <!-- Mapped LSPs -->
          <div class="col-md-4">
            <div class="border-color">
              <div class="lsp-data card mb-0 p-2 shadow-sm">
                <div class="d-flex justify-content-between align-items-center">
                  <h5 class="mb-0 name-list single-line">Mapped LSP</h5>
                  <span *ngIf="!showMappedSearch" class="input-group-text cursor-pointer" (click)="toggleSearch('mapped')">
                    <i class="fas fa-search"></i>
                  </span>
                  <div *ngIf="showMappedSearch" class="input-group leftright-radius ms-2">
                    <input class="form-control" placeholder="Search Mapped LSPs..."  [(ngModel)]="mappedSearchText">
                    <span class="input-group-text cursor-pointer" (click)="toggleSearch('mapped')">
                      <i class="fas fa-search"></i>
                    </span>
                  </div>
                </div>
              </div>

              <div class="p-3 overflow-lab">
                <ng-container *ngIf="selectedCustomer; else noCustomerSelected">
                  <ng-container *ngIf="mappedCustomerLspMap[selectedCustomer.customerId]?.length; else noMapping">
                    <ul>
                      <li *ngFor="let lspName of mappedCustomerLspMap[selectedCustomer.customerId] | searchList: mappedSearchText"
                          class="p-2 mb-2 searc-data d-flex justify-content-between align-items-center cursor-pointer"
                          (click)="toggleMappedLspSelection(lspName)">
                        <div class="mr-0 p-2 lab-color w-100 d-flex justify-content-between">
                          {{ lspName }}
                        </div>
                      </li>
                    </ul>
                  </ng-container>
                </ng-container>

                <ng-template #noMapping>
                  <p class="text-muted small d-flex justify-content-center">No LSPs mapped.</p>
                </ng-template>
                <ng-template #noCustomerSelected>
                  <div class="d-flex justify-content-center">
                    <p class="text-muted small">Select a customer to see mapped LSPs.</p>
                  </div>
                </ng-template>
              </div>
            </div>
          </div>
   <div class="position-absolute top-50 start translate-middle">
          <i class="fa-solid fa-right-left fs-6 text-secondary px-2"></i>
        </div>
          <!-- Available LSPs -->
          <div class="col-md-4">
            <div class="border-color">
              <div class="lsp-data card mb-0 p-2 shadow-sm">
                <div class="d-flex justify-content-between align-items-center">
                  <h5 class="mb-0 name-list single-line">Available LSPs</h5>
                  <span *ngIf="!showAvailableSearch" class="input-group-text cursor-pointer" (click)="toggleSearch('available')">
                    <i class="fas fa-search"></i>
                  </span>
                  <div *ngIf="showAvailableSearch" class="input-group leftright-radius ms-2">
                    <input class="form-control" placeholder="Search LSPs..." [(ngModel)]="lspSearchText">
                    <span class="input-group-text cursor-pointer" (click)="toggleSearch('available')">
                      <i class="fas fa-search"></i>
                    </span>
                  </div>
                </div>
              </div>

              <div class="p-3 overflow-lab">
                <ul>
                  <li *ngFor="let lsp of availableLsps | searchList: lspSearchText"
                      class="p-2 mb-2 searc-data d-flex justify-content-between align-items-center cursor-pointer"
                      (click)="toggleLspSelection(lsp)">
                    <div class="mr-0 p-2 lab-color w-100 d-flex justify-content-between">
                      {{ lsp.lspName }}
                    </div>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between mb-3 mx-4">
       <div>
         <div class="checkbox p-0 form-check checkbox checkbox-solid-success"  *ngIf="lspMappingId != ''">
          <input id="dafault-checkbox" type="checkbox" [(ngModel)]="isActive" (click)="checkLspTatDetail($event)"/>
          <label class="mb-0" for="dafault-checkbox">Active</label>
        </div>
       </div>
        <button class="btn btn-square btn-success pull-right rounded-3" (click)="onSave()" type="submit"><i class="fa fa-check"></i> Submit</button>
      </div>
 
    </div>
  </div>
</div>

<div class="row">
  <div class="col-sm-12">
    <div class="card">
      <!-- <div class="modal-header modal-header bs-blue d-flex justify-content-between">
        <h5 class="modal-title" id="exampleModalLabel">{{lspMappingId ? 'Update Lsp Mapping':'Add Lsp Mapping'}}</h5>
        <button data-bs-dismiss="modal" class="close" (click)="onClose()"><i class="fa fa-close" ></i></button>
    </div> -->
      <div class="card-body pb-0">
        <form [formGroup]="lspMappingForm" class="needs-validation" autocomplete="off"
          (submit)="onSubmitLspMapping(lspMappingForm)">
          <div class="tab-content" id="info-tabContent">
            <div class="tab-pane fade active show" id="basic-info" role="tabpanel" aria-labelledby="basic-info-tab">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="col-form-label">Customer Name</label>
                  <ng-select [items]="customers" bindLabel="customerName" bindValue="customerId"
                    formControlName="customerId" placeholder="Select Customer" [searchable]="true"
                    [readonly]="lspMappingId ? true : false"
                    [ngClass]="{ 'border-danger': lspMappingForm.controls['customerId'].invalid && lspMappingForm.controls['customerId'].touched}">
                  </ng-select>

                  <div *ngIf="lspMappingForm.controls['customerId'].invalid && lspMappingForm.controls['customerId']?.touched" class="text-danger">
                    <small *ngIf="lspMappingForm.controls['customerId'].errors?.['required']">Customer is
                      required.</small>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-group">
                    <label for="lsps">Lsps</label>
                    <ng-select [items]="lsps" bindLabel="lspName" bindValue="lspId" formControlName="lspIds"
                      placeholder="Select Lsps" [multiple]="true" [closeOnSelect]="false" [searchable]="true"
                      [ngClass]="{ 'border-danger': lspMappingForm.controls['lspIds'].invalid && lspMappingForm.controls['lspIds'].touched}">
                    </ng-select>
                    <div *ngIf="lspMappingForm.controls['lspIds'].invalid && lspMappingForm.controls['lspIds'].touched" class="text-danger">
                      Please select at least one role.
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label for="lsps">Support Email Address</label>
                  <input class="form-control" formControlName="supportEmail" type="text"  placeholder="Enter support email"
                  [ngClass]="{ 'border-danger': lspMappingForm.controls['supportEmail'].invalid && lspMappingForm.controls['supportEmail'].touched}" />
                  <div class="text-danger">
                    <small *ngIf="lspMappingForm.controls['supportEmail'].errors?.['pattern']">Support Email Address is invalid.</small>
                  </div>
                </div>
              </div>
              <div class="checkbox p-0" *ngIf="lspMappingId != ''">
                <input id="dafault-checkbox" type="checkbox" formControlName="isActive" />
                <label class="mb-0" for="dafault-checkbox">Active</label>
              </div>
            </div>
          </div>
          <!-- <div class="mt-2">
            <button class="btn btn-success" data-bs-original-title="" type="submit" id="btnSubmit" title=""
              [disabled]="lspMappingForm.invalid">
              <i class="fa fa-check"></i> Submit</button>&nbsp;
            <button class="btn btn-danger" type="reset">
              <i class="fa fa-times"></i> Reset
            </button>
          </div> -->

          <div class="gap-2 d-flex justify-content-end">
            <button class="btn btn-square btn-success pull-right rounded-3" type="submit"><i class="fa fa-check"></i> Submit</button>&nbsp;
            <button class="btn btn-square btn-danger pull-right rounded-3" type="reset"><i class="fa fa-times"></i> Reset</button>
        </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="modal-header bs-blue d-flex justify-content-between">
          <h5 class="modal-title" id="exampleModalLabel">Import Docket</h5>
          <button data-bs-dismiss="modal" class="close" >
            <i class="fa fa-close"></i>
          </button>
        </div>
        <div class="card-body pt-2 pb-0">
          <div class="card-header d-flex align-items-center justify-content-between p-0">
            <h5></h5>
            <button class="btn btn-square btn-primary pull-right rounded-3" (click)="downloadSampleFile($event)">Import Sample</button>
          </div>
          <div class="row">
            <div class="col-sm-12">
              <div class="card mb-0">
                <div class="card-body px-0 py-3">
                  <!-- <h4>Select POD File</h4> -->
                  <ngx-dropzone class="dropzone dropzone-info" [multiple]="true" (change)="onChangeFile($event)">
                    <ngx-dropzone-label>
                      <div class="dz-message needsclick">
                        <i class="icon-cloud-up"></i>
                        <h6>Drop files here or click to upload.</h6>
                        <span class="note needsclick">
                          (This is just a demo dropzone. Selected files are <strong>not</strong> actually uploaded.)
                        </span>
                      </div>
                    </ngx-dropzone-label>
                  
                    <!-- Show selected files -->
                    <ngx-dropzone-preview *ngFor="let file of files" [file]="file" (removed)="onRemoveFile(file)">
                        <ngx-dropzone-label>{{ file.name }}</ngx-dropzone-label>
                    </ngx-dropzone-preview>
                  </ngx-dropzone>
                  
                </div>
              </div>
            </div>
          </div>
      </div>
    </div>
  </div>

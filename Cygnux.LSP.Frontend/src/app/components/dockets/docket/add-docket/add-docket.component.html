<div class="row">
  <div class="col-sm-12">
    <div class="card">
      <div class="modal-header bs-blue d-flex justify-content-between">
        <h5 class="modal-title" id="exampleModalLabel">{{!docketId ? 'Add Docket' : 'Update Docket'}}</h5>
        <!-- <button class="btn-close" type="button" (click)="onClose()" aria-label="Close"></button> -->
        <button data-bs-dismiss="modal" class="close"  (click)="onClose()"><i class="fa fa-close" ></i></button>
      </div>
      <div class="card-body pb-0">
        <form [formGroup]="docketForm" class="needs-validation" autocomplete="off"
          (submit)="onSubmitDocket(docketForm)">
          <!-- <ul class="nav nav-tabs border-tab nav-primary" id="info-tab" role="tablist">
            <li class="nav-item">
              <a class="nav-link active" id="basic-info-tab" data-bs-toggle="tab" href="#basic-info" role="tab"
                aria-controls="basic-info" aria-selected="true">
                <i class="icofont icofont-ui-home"></i>Basic Info
              </a>
            </li>
           <li class="nav-item">
              <a class="nav-link" id="other-info-tab" data-bs-toggle="tab" href="#other-info" role="tab"
                aria-controls="other-info" aria-selected="false">
                <i class="icofont icofont-contacts"></i>Other Info
              </a>
            </li> 
          </ul> -->
          <div class="tab-content" id="info-tabContent">
            <div class="tab-pane fade active show" id="basic-info" role="tabpanel" aria-labelledby="basic-info-tab">
              <div class="row g-3">
                <div class="col-md-6 mb-11">
                  <label class="col-form-label">Docket No.</label>
                  <input class="form-control" formControlName="docketNo" type="text" required placeholder="Enter Docket No"
                    [ngClass]="{ 'border-danger': docketForm.controls['docketNo'].invalid && docketForm.controls['docketNo'].touched}" />
                  <div *ngIf="docketForm.controls['docketNo'].invalid && docketForm.controls['docketNo']?.touched" class="text-danger">
                    <small *ngIf="docketForm.controls['docketNo'].errors?.['required']">Docket No. is required.</small>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="col-form-label">Customer</label>
                  <ng-select [items]="customers" bindLabel="customerName" bindValue="customerId"
                    formControlName="customerId" placeholder="Select Customer" [searchable]="true"
                    (change)="onSelectCustomer($event)"
                    [ngClass]="{ 'border-danger': docketForm.controls['customerId'].invalid && docketForm.controls['customerId'].touched}">
                  </ng-select>
                  <div *ngIf="docketForm.controls['customerId'].invalid && docketForm.controls['customerId']?.touched" class="text-danger">
                    <small *ngIf="docketForm.controls['customerId'].errors?.['required']">Customer is required.</small>
                  </div>
                </div>
                <div class="col-md-6 mb-1">
                  <label class="col-form-label">From WH/Store</label>
                  <ng-select [items]="customerLocation" bindLabel="location" bindValue="customerId"
                    formControlName="fromLocation" placeholder="Select From WH/Store" [searchable]="true"  (change)="onSelectOrigin($event)"
                   
                    [ngClass]="{ 'border-danger': docketForm.controls['fromLocation'].invalid && docketForm.controls['fromLocation'].touched}">
                  </ng-select>
                  <div *ngIf="docketForm.controls['fromLocation'].invalid && docketForm.controls['fromLocation']?.touched" class="text-danger">
                    <small *ngIf="docketForm.controls['fromLocation'].errors?.['required']">From Location is
                      required.</small>
                  </div>
                </div>
                <div class="col-md-6 mb-11">
                  <label class="col-form-label">To WH/Store</label>
                  <!-- <input class="form-control" formControlName="toLocation" type="text" required placeholder="Enter To WH/Store"
                    [ngClass]="{ 'border-danger': docketForm.controls['toLocation'].invalid && docketForm.controls['toLocation'].touched}" /> -->
                    <ng-select [items]="customerLocation" bindLabel="location" bindValue="customerId"
                    formControlName="toLocation" placeholder="To WH/Store" [searchable]="true"></ng-select>
                  <div *ngIf="docketForm.controls['toLocation'].invalid && docketForm.controls['toLocation']?.touched" class="text-danger">
                    <small *ngIf="docketForm.controls['toLocation'].errors?.['required']">To Location is
                      required.</small>
                  </div>
                </div>
                <div class="col-md-6 mb-11">
                  <label class="col-form-label">Booking Date</label>
                  <!-- <input class="form-control" formControlName="bookingDate" type="date" required
                    [value]="formatDate(docketForm.controls['bookingDate'].value)"/> -->

                    <input type="text"
                    class="form-control"
                    #dp="bsDatepicker" formControlName="bookingDate" 
                    bsDatepicker [bsConfig]="{dateInputFormat:'DD.MM.YYYY'}"
                    [ngClass]="{ 'border-danger': docketForm.controls['bookingDate'].invalid && docketForm.controls['bookingDate'].touched}">
                    
                  <div *ngIf="docketForm.controls['bookingDate'].invalid && docketForm.controls['bookingDate']?.touched" class="text-danger">
                    <small *ngIf="docketForm.controls['bookingDate'].errors?.['required']">Booking Date is
                      required.</small>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="col-form-label">Invoice No.</label>
                  <input class="form-control" formControlName="invoiceNo" type="text" required placeholder="Enter Invoice No"
                    [ngClass]="{ 'border-danger': docketForm.controls['invoiceNo'].invalid && docketForm.controls['invoiceNo'].touched}" />
                  <div *ngIf="docketForm.controls['invoiceNo'].invalid && docketForm.controls['invoiceNo']?.touched" class="text-danger">
                    <small *ngIf="docketForm.controls['invoiceNo'].errors?.['required']">Invoice No. is
                      required.</small>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="col-form-label">Transporter</label>
                  <!-- <input class="form-control" formControlName="transporter" type="text" required placeholder="Enter Transporter"
                    [ngClass]="{ 'border-danger': docketForm.controls['transporter'].invalid && docketForm.controls['transporter'].touched}" /> -->
                    <ng-select [items]="transporter"
                    bindLabel="codeDesc"
                    bindValue="codeId"
                    formControlName="transporter"
                    placeholder="Search transporter"
                    [searchable]="true"
                    [ngClass]="{ 'border-danger': docketForm.controls['transporter'].invalid && docketForm.controls['transporter'].touched}" 
                    >
                    </ng-select>
                  <div *ngIf="docketForm.controls['transporter'].invalid && docketForm.controls['transporter']?.touched" class="text-danger">
                    <small *ngIf="docketForm.controls['transporter'].errors?.['required']">Transporter is
                      required.</small>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="col-form-label">Transport Mode</label>
                  <!-- <input class="form-control" formControlName="transportMode" type="text" required placeholder="Enter Transport Mode"
                    [ngClass]="{ 'border-danger': docketForm.controls['transportMode'].invalid && docketForm.controls['transportMode'].touched}" /> -->
                    <ng-select [items]="transportMode"
                    bindLabel="codeDesc"
                    bindValue="codeId"
                    formControlName="transportMode"
                    placeholder="Search transportMode"
                    [searchable]="true"
                    [ngClass]="{ 'border-danger': docketForm.controls['transportMode'].invalid && docketForm.controls['transportMode'].touched}" 
                    >
                    </ng-select>
                  <div *ngIf="docketForm.controls['transportMode'].invalid && docketForm.controls['transportMode']?.touched" class="text-danger">
                    <small *ngIf="docketForm.controls['transportMode'].errors?.['required']">transport Mode is
                      required.</small>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="col-form-label">Quantity</label>
                  <input class="form-control" formControlName="quantity" type="text" required placeholder="Enter Quantity"
                    [ngClass]="{ 'border-danger': docketForm.controls['quantity'].invalid && docketForm.controls['quantity'].touched}" />
                  <div *ngIf="docketForm.controls['quantity'].invalid && docketForm.controls['quantity']?.touched" class="text-danger">
                    <small *ngIf="docketForm.controls['quantity'].errors?.['required']">Quantity is required.</small>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- <div class="mt-4">
            <button class="btn btn-success" data-bs-original-title="" type="submit" id="btnSubmit" title=""
              [disabled]="docketForm.invalid">
              <i class="fa fa-check"></i> Submit</button>&nbsp;
            <button class="btn btn-danger" type="reset">
              <i class="fa fa-times"></i> Reset
            </button>
          </div> -->
          <div class="gap-2 d-flex justify-content-end">
            <button class="btn btn-square btn-success pull-right rounded-3" type="submit" [disabled]="docketForm.invalid"><i class="fa fa-check"></i> Submit</button>&nbsp;
            <button class="btn btn-square btn-danger pull-right rounded-3" type="reset"><i class="fa fa-times"></i> Reset</button>
        </div>
        </form>
      </div>
    </div>
  </div>
</div>

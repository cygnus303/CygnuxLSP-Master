<div class="row">
  <div class="col-sm-12">
    <div class="card">
      <div class="modal-header bs-blue d-flex justify-content-between">
        <h5 class="modal-title" id="exampleModalLabel">Status Update</h5>
        <button data-bs-dismiss="modal" class="close"><i class="fa fa-close" ></i></button>
      </div>
      <div class="card-body pb-0">
        <form  class="needs-validation" autocomplete="off" [formGroup]="statusUpdateForm" (submit)="onSubmitStatus(statusUpdateForm)">
          <div class="tab-content" id="info-tabContent">
            <div class="tab-pane fade active show" id="basic-info" role="tabpanel" aria-labelledby="basic-info-tab">
              <div class="row g-3">
                  <div class="col-md-6">
                      <div class="form-group">
                        <label for="lsps">Docket Number</label>
                        <input class="form-control" formControlName="docketNo" type="text"  placeholder="Enter docket Number"readonly/>
                        <div *ngIf="statusUpdateForm.controls['docketNo'].invalid && statusUpdateForm.controls['docketNo']?.touched" class="text-danger">
                          <small *ngIf="statusUpdateForm.controls['docketNo'].errors?.['required']">docketNumber is required.</small>
                          <small *ngIf="statusUpdateForm.controls['docketNo'].errors?.['pattern']">docketNumber is invalid.</small>
                        </div>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="lsps">LSP Name</label>
                        <input class="form-control" formControlName="transporterDesc" type="text"  placeholder="Enter Lsp Name" readonly/>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="lsps">Order Date</label>
                        <input type="text" class="form-control" #dp="bsDatepicker" formControlName="bookingDate"  bsDatepicker [bsConfig]="{dateInputFormat:'DD.MM.YYYY'}">
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="lsps">Status Date </label>     
                        <!-- <input class="form-control" placeholder="dd/mm/yyyy" #datepickerMDY="bsDatepicker" bsDatepicker required
                        formControlName="statusDate" [bsConfig]="{ dateInputFormat: 'DD/MM/YYYY' }"> -->
                        <input type="text" class="form-control" #dp="bsDatepicker" formControlName="statusDate"  bsDatepicker [bsConfig]="{dateInputFormat:'DD.MM.YYYY'}" [class.disabled]="true">
                        <div *ngIf="statusUpdateForm.controls['statusDate'].invalid && statusUpdateForm.controls['statusDate']?.touched" class="text-danger">
                          <small *ngIf="statusUpdateForm.controls['statusDate'].errors?.['required']">statusDate is required.</small>
                        </div>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="lsps">From City </label>
                        <input class="form-control" formControlName="fromLocation" type="text"  placeholder="Enter city" readonly/>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="lsps">To City </label>
                        <input class="form-control" formControlName="toLocation" type="text"  placeholder="Enter city" readonly/>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="lsps">Current Status</label>
                        <ng-select [items]="transporter" bindLabel="codeDesc" bindValue="codeId" formControlName="currentStatus" placeholder="Search Status" [searchable]="true" readonly></ng-select>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="lsps">Change Status</label>
                       <ng-select [items]="transporter" bindLabel="codeDesc" bindValue="codeId" formControlName="nextDocketStatus" placeholder="Search Status" [searchable]="true"
                          [ngClass]="{ 'border-danger': statusUpdateForm.controls['nextDocketStatus'].invalid && statusUpdateForm.controls['nextDocketStatus'].touched}">
                       </ng-select>
                        <div *ngIf="statusUpdateForm.controls['nextDocketStatus'].invalid && statusUpdateForm.controls['nextDocketStatus']?.touched" class="text-danger">
                          <small *ngIf="statusUpdateForm.controls['nextDocketStatus'].errors?.['required']">changeStatus is required.</small>
                          <small *ngIf="statusUpdateForm.controls['nextDocketStatus'].errors?.['pattern']">changeStatus is invalid.</small>
                        </div>
                      </div>
                    </div>
                    <div class="col-md-6" *ngIf="statusUpdateForm.get('nextDocketStatus')?.value == '6'">
                      <div class="form-group">
                        <label for="lsps">POD</label>
                        <input class="form-control" formControlName="pod" type="file" accept="image/*" />
                        <div *ngIf="statusUpdateForm.controls['pod'].invalid && statusUpdateForm.controls['pod']?.touched" class="text-danger">
                          <small *ngIf="statusUpdateForm.controls['pod'].errors?.['required']">pod is required.</small>
                          <small *ngIf="statusUpdateForm.controls['pod'].errors?.['pattern']">pod is invalid.</small>
                        </div>
                      </div>
                    </div>
              </div>
            </div>
          </div>
          <div class="gap-2 d-flex justify-content-end">
            <button class="btn btn-square btn-success pull-right rounded-3" type="submit" ><i class="fa fa-check"></i> Submit</button>&nbsp;
            <button class="btn btn-square btn-danger pull-right rounded-3" type="reset"><i class="fa fa-times"></i> Reset</button>
        </div>
        </form>
      </div>
    </div>
  </div>
</div>

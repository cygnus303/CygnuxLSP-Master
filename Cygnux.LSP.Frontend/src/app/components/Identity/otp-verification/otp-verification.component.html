<div class="page-wrapper">
  <div class="container-fluid p-0">
    <div class="row">
      <div class="col-12">
        <div class="login-card">
          <div>
            <div><a class="logo" href="index.html"><img class="img-fluid for-light"
                  src="../assets/images/logo/logo2.png" alt="looginpage"></a></div>
            <div class="login-main">
              <form class="theme-form" #emailForm="ngForm" (ngSubmit)="sendOtp()">
                <h4>Reset Your Password</h4>
                <div class="form-group">
                  <label class="col-form-label">Enter Your Email Address</label>
                  <div class="row">
                    <div class="col-12 col-sm-12">
                      <input class="form-control mb-1" type="email" name="email" [(ngModel)]="email"
                        placeholder="Enter Your Email" required email #emailInput="ngModel">
                      <div class="text-danger" *ngIf="emailInput.invalid && emailInput.touched">
                        Enter a valid email address
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="text-end">
                        <button class="btn btn-primary btn-block m-t-10" type="submit" [disabled]="emailForm.invalid">
                          Send
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="form-group" *ngIf="showOtp">
                  <label class="col-form-label pt-0">Enter OTP</label>
                  <div class="row">
                    <div class="col">
                      <input class="form-control text-center opt-text" type="text" maxlength="1" [(ngModel)]="otp.d1"
                        name="d1" (input)="moveFocus($event, d2)" #d1>
                    </div>
                    <div class="col">
                      <input class="form-control text-center opt-text" type="text" maxlength="1" [(ngModel)]="otp.d2"
                        name="d2" (input)="moveFocus($event, d3)" (keydown.backspace)="backspace($event, d1)" #d2>
                    </div>
                    <div class="col">
                      <input class="form-control text-center opt-text" type="text" maxlength="1" [(ngModel)]="otp.d3"
                        name="d3" (input)="moveFocus($event, d4)" (keydown.backspace)="backspace($event, d2)" #d3>
                    </div>
                    <div class="col">
                      <input class="form-control text-center opt-text" type="text" maxlength="1" [(ngModel)]="otp.d4"
                        name="d4" (input)="moveFocus($event, d5)" (keydown.backspace)="backspace($event, d3)" #d4>
                    </div>
                    <div class="col">
                      <input class="form-control text-center opt-text" type="text" maxlength="1" [(ngModel)]="otp.d5"
                        name="d5" (input)="moveFocus($event, d6)" (keydown.backspace)="backspace($event, d4)" #d5>
                    </div>
                    <div class="col">
                      <input class="form-control text-center opt-text" type="text" maxlength="1" [(ngModel)]="otp.d6"
                        name="d6" (input)="verifyOtp()" (keydown.backspace)="backspace($event, d5)" #d6>
                    </div>
                  </div>
                   <div class="mt-4 mb-4"><span class="reset-password-link">If don't receive OTP?<a
                                        class="btn-link text-danger">Resend</a></span></div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

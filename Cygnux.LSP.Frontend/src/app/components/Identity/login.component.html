<!-- login page start-->
<div class="container-fluid p-0" >
    <div class="row m-0">
        <div class="col-12 p-0">
            <div class="login-card">
                <div>
                    <div><a class="logo" href="index.html"><img class="img-fluid for-light" src="assets/images/logo/logo.png" alt="looginpage"></a></div>
                    <div class="login-main">
                        <form class="theme-form" [formGroup]="loginFormGroup" autocomplete="off"
                            (submit)="onSubmitLogin()">
                            <h4 class="text-center">Sign in to account</h4>
                            <p class="text-center">Enter your email & password to login</p>
                            <div class="form-group">
                                <label class="col-form-label">Email Address</label>
                                <input class="form-control" formControlName="email" type="email" required=""
                                    placeholder="Enter Email">
                                <div *ngIf="loginFormGroup.controls['email'].invalid && loginFormGroup.controls['email']?.touched"
                                    class="text-danger">
                                    <small *ngIf="loginFormGroup.controls['email'].errors?.['required']">Email
                                        is required.</small>
                                    <small *ngIf="loginFormGroup.controls['email'].errors?.['pattern']">Email
                                        is invalid.</small>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-form-label">Password</label>
                                     <div class="form-input position-relative">
                                      <input class="form-control" formControlName="password" type="password"
                                        name="login[password]" required="" [type]="isPasswordVisible ? 'text' : 'password'" placeholder="Enter Password">
                                      <div class="align-middle position-absolute top-50 translate-middle-y end-0 pe-3" (click)="togglePasswordVisibility()"> 
                                        <i class="fa"  [style.color]="isPasswordVisible ? 'darkblue' : 'gray'" [ngClass]="isPasswordVisible ? 'fa-eye' : 'fa-eye-slash'"></i>
                                      </div>
                                    </div>
                                    <div *ngIf="loginFormGroup.controls['password'].invalid && loginFormGroup.controls['password']?.touched"
                                        class="text-danger">
                                        <small *ngIf="loginFormGroup.controls['password'].errors?.['required']">Password
                                            is required.</small>
                                        <small *ngIf="loginFormGroup.controls['password'].errors?.['pattern']">Password
                                            is invalid.</small>
                                    </div>
                            </div>
                            <div class="form-group mb-0">
                                <div class="checkbox p-0">
                                    <input id="checkbox1" type="checkbox">
                                    <label class="text-muted" for="checkbox1">Remember password</label>
                                </div><a class="link cursor-pointer" routerLink="forgot-password">Forgot password?</a>
                                <div class="text-end mt-3">
                                  <button 
                                  class="btn btn-primary btn-block w-100" 
                                  [disabled]="loginFormGroup.invalid || loading"
                                  type="submit">
                                  <ng-container *ngIf="!loading; else loadingTemplate">
                                    Sign in
                                  </ng-container>
                                  <ng-template #loadingTemplate>
                                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                                    Loading...
                                  </ng-template>
                                </button>
                                
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

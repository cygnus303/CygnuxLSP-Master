<div class="page-wrapper">
  <div class="container-fluid p-0">
    <div class="row">
      <div class="col-12">
        <div class="login-card">
          <div>
          <!-- <div><a class="logo" href="index.html"><img class="img-fluid for-light" src="../assets/images/logo/logo2.png" alt="loginpage"></a></div> -->
          <div class="login-main">
            <form class="theme-form" [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
              <h4>Set Your Password</h4>

              <div class="d-flex align-items-center color-red mb-3" *ngIf="loginErrorMessage">
                <i class="fa fa-exclamation-circle me-2 "></i>
                <span class="fw-semibold fs-6">{{ loginErrorMessage }}</span>
              </div>

              <!-- New Password -->
              <div class="form-group">
                <label class="col-form-label">New Password</label>
                <div class="form-input position-relative">
                  <input class="form-control"
                         [type]="isPasswordVisible ? 'text' : 'password'"
                         placeholder="Enter New Password"
                         formControlName="newPassword">
                  <div class="align-middle position-absolute cursor-pointer top-50 translate-middle-y end-0 pe-3"
                       (click)="togglePasswordVisibility()">
                    <i class="fa fs-11" [style.color]="isPasswordVisible ? 'darkblue' : 'gray'"
                       [ngClass]="isPasswordVisible ? 'fa-eye' : 'fa-eye-slash'"></i>
                  </div>
                </div>
                <div class="text-danger mt-1" *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid">
                  <div *ngIf="passwordForm.get('newPassword')?.errors?.['required']">Password is required.</div>
                  <div *ngIf="passwordForm.get('newPassword')?.errors?.['minlength']">Password must be at least 8 characters.</div>
                  <div *ngIf="passwordForm.get('newPassword')?.errors?.['pattern']">Must include uppercase, lowercase, number, and special character.</div>
                </div>
              </div>

              <!-- Confirm Password -->
              <div class="form-group">
                <label class="col-form-label">Confirm Password</label>
                <div class="form-input position-relative">
                  <input class="form-control"
                         [type]="isConfirmVisible ? 'text' : 'password'"
                         placeholder="Enter Confirm Password"
                         formControlName="confirmPassword">
                  <div class="align-middle position-absolute cursor-pointer top-50 translate-middle-y end-0 pe-3"
                       (click)="toggleConfirmVisibility()">
                    <i class="fa fs-11" [style.color]="isConfirmVisible ? 'darkblue' : 'gray'"
                       [ngClass]="isConfirmVisible ? 'fa-eye' : 'fa-eye-slash'"></i>
                  </div>
                </div>
                <div class="text-danger mt-1" *ngIf="passwordForm.errors?.['mismatch'] && passwordForm.get('confirmPassword')?.touched">
                  Confirm password must match new password.
                </div>
              </div>

              <!-- Checkbox and Submit -->
              <div class="form-group mb-0">
                <div class="checkbox p-0">
                  <input id="checkbox1" type="checkbox">
                  <label class="text-muted" for="checkbox1">Remember password</label>
                </div>
                <!-- <button class="btn btn-primary btn-block w-100 mt-3" style="background-color: #406da4 !important;" type="submit" [disabled]="passwordForm.invalid" >Done</button> -->
                <button class="btn btn-primary btn-block w-100 mt-3" style="background-color: #406da4 !important;" type="submit"
                  [disabled]="passwordForm.invalid || isSubmitting">
                
                  <ng-container *ngIf="!isSubmitting; else loadingDone">
                    Done
                  </ng-container>
                
                  <ng-template #loadingDone>
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    Please wait...
                  </ng-template>
                </button>

              </div>

              <p class="mt-4 mb-0 text-center">Already have a password?
                <a class="ms-2 cursor-pointer" routerLink="/login">Sign in</a>
              </p>
            </form>
          </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

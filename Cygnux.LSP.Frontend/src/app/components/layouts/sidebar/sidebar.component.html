  <div class="sidebar-wrapper">
    <div>
      <div class="logo-wrapper"><a href="index.html"><img class="img-fluid for-light" src="assets/images/logo/logo.png"
            alt=""></a>
        <div class="back-btn"><i data-feather="grid"></i></div>
        <div class="toggle-sidebar icon-box-sidebar" (click)="toggleSidebar()" ><i class="status_toggle middle sidebar-toggle" data-feather="grid">
          </i></div>
      </div>
      <div class="logo-icon-wrapper"><a href="index.html">
          <div class="icon-box-sidebar"><i data-feather="grid"></i></div>
        </a></div>
      <nav class="sidebar-main">
        <div class="left-arrow" id="left-arrow"><i data-feather="arrow-left"></i></div>
        <div id="sidebar-menu">
          <ul class="sidebar-links" id="simple-bar">
            <li class="back-btn">
              <div class="mobile-back text-end"><span>Back</span><i class="fa fa-angle-right ps-2" aria-hidden="true"></i></div>
            </li>
            <li class="pin-title sidebar-list">
              <h6>Pinned</h6>
            </li>
            @for (data of menus; track $index) {
            <li class="sidebar-list">
              <a [routerLink]="[data.navigationUrl]" class="sidebar-link sidebar-title link-nav">
                <i [attr.data-feather]="data.icon"></i>
                <span>{{ data.menuName }}</span>
              </a>
            </li>
            }
          </ul>
        </div>
      </nav>
    </div>
  </div>

<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="modal-header bs-blue d-flex justify-content-between">
                <h5 class="modal-title" id="exampleModalLabel">{{!roleId ? 'Add Role' : 'Update Role'}}</h5>
                <button data-bs-dismiss="modal" class="close" (click)="onClose()"><i data-feather="x" ></i></button>
            </div>
            <div class="card-body pt-2 pb-0">
                <form [formGroup]="roleForm" class="needs-validation" autocomplete="off"
                    (submit)="onSubmitRole(roleForm)">
                    
                    <div class="tab-content" id="info-tabContent">
                        <div class="tab-pane fade active show" id="basic-info" role="tabpanel"
                            aria-labelledby="basic-info-tab">
                            <div class="row g-3">
                                <div class="col-md-6 mb-11">
                                  <label class="col-form-label">Role Name</label>
                                  <input class="form-control"
                                    formControlName="roleName"
                                    type="text"
                                    required
                                    placeholder="Enter Role Name"
                                    [ngClass]="{ 'border-danger': roleForm.controls['roleName'].invalid && roleForm.controls['roleName'].touched }"/>
                              
                                  <div *ngIf="roleForm.controls['roleName'].invalid && roleForm.controls['roleName']?.touched"
                                    class="text-danger">
                                    <small *ngIf="roleForm.controls['roleName'].errors?.['required']">
                                      Role name is required.
                                    </small>
                                  </div>
                              
                                  <div class="form-check mt-2" *ngIf="roleId != ''">
                                    <input class="form-check-input"
                                      type="checkbox"
                                      id="default-checkbox"
                                      formControlName="isActive">
                                    <label class="form-check-label" for="default-checkbox">
                                      Active
                                    </label>
                                  </div>
                                </div>
                              </div>
                        </div>
                    </div>
                    <div class="gap-2 d-flex justify-content-end">
                        <button class="btn btn-square btn-success pull-right rounded-3" type="submit" [disabled]="roleForm.invalid"><i class="fa fa-check"></i> Submit</button>&nbsp;
                        <button class="btn btn-square btn-danger pull-right rounded-3" type="reset" *ngIf="!roleId"><i class="fa fa-times"></i> Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

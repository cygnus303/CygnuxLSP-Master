<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-body">
                <table class="table table-header table-bordered align-middle w-100">
                    <thead class="table-light">
                        <tr class="table-th">
                            <th>
                                <input type="checkbox" class="form-check-input me-2" [(ngModel)]="allChecked"
                                    (change)="toggleAllRows($event)"> Menu Name
                            </th>
                            <th>
                                <input type="checkbox" class="form-check-input me-2" [(ngModel)]="allViewChecked"
                                    (change)="toggleColumn('view', $event)"> View
                            </th>
                            <th>
                                <input type="checkbox" class="form-check-input me-2" [(ngModel)]="allCreateChecked"
                                    (change)="toggleColumn('create', $event)"> Create
                            </th>
                            <th>
                                <input type="checkbox" class="form-check-input me-2" [(ngModel)]="allEditChecked"
                                    (change)="toggleColumn('edit', $event)"> Edit
                            </th>
                            <th>
                                <input type="checkbox" class="form-check-input me-2" [(ngModel)]="allDeleteChecked"
                                    (change)="toggleColumn('delete', $event)"> Delete
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let menu of menus">
                            <!-- <td>
                                <input type="checkbox" class="form-check-input me-2" 
                                   > {{ menu.menuName }}
                            </td> -->
                            <td>
                                {{ menu.menuName }}
                            </td>
                            <td>
                                <input type="checkbox" class="form-check-input me-2" [(ngModel)]="menu.canView"
                                    (change)="updateMainCheckbox()">
                            </td>
                            <td>
                                <input type="checkbox" class="form-check-input me-2" [(ngModel)]="menu.canCreate"
                                    (change)="updateMainCheckbox()">
                            </td>
                            <td>
                                <input type="checkbox" class="form-check-input me-2" [(ngModel)]="menu.canEdit"
                                    (change)="updateMainCheckbox()">
                            </td>
                            <td>
                                <input type="checkbox" class="form-check-input me-2" [(ngModel)]="menu.canDelete"
                                    (change)="updateMainCheckbox()">
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- Save button to trigger the savePermissions method -->
                <button class="btn btn-primary mt-4" (click)="savePermissions()">Save Permissions</button>
            </div>
        </div>
    </div>
</div>
